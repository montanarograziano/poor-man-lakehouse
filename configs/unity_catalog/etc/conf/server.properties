# Unity Catalog OSS v0.5.0 server configuration (based on upstream etc/conf/server.properties).
#
# Storage note: this stack uses file:// table locations (bind-mounted at the same
# absolute path on host and container), because UC OSS still cannot vend credentials
# for S3-compatible endpoints like MinIO — there is no s3.endpoint property and
# vending is AWS-STS based (upstream issues #844, #1324 still open as of 2026-07).
# file:// locations skip credential vending entirely, on the server, in the Spark
# connector, and in DuckDB's unity_catalog extension.

server.env=dev

## Identity Provider authorization parameters (disabled for local use).
# If you ever enable authorization, server.allowed-issuers and server.audiences
# are REQUIRED since v0.4.1 (CVE-2026-27478 fix).
server.authorization=disable
server.authorization-url=
server.token-url=
server.client-id=
server.client-secret=
server.redirect-port=
server.allowed-issuers=
server.audiences=

# D-Days H-Hours M-Minutes S-Seconds (P5D = 5 days, PT5M = 5 minutes, ...)
server.cookie-timeout=P5D

# MANAGED tables (default true since v0.5.0, kept explicit for clarity)
server.managed-table.enabled=true

#### AWS credential configs (unused with file:// storage)
aws.masterRoleArn=
aws.accessKey=
aws.secretKey=
aws.region=

#### Legacy per-bucket S3 credential config.
# Kept pointing at MinIO for future experiments; NOT functional for vending today:
# the server has no endpoint override, so vended credentials always target AWS.
s3.bucketPath.0=warehouse
s3.region.0=eu-central-1
s3.awsRoleArn.0=
s3.accessKey.0=minioadmin
s3.secretKey.0=miniopassword
# Test Only (a non-empty session token makes the server return these static creds as-is)
s3.sessionToken.0=

## ADLS Storage Config
adls.storageAccountName.0=
adls.tenantId.0=
adls.clientId.0=
adls.clientSecret.0=

## GCS Storage Config
gcs.bucketPath.0=
gcs.jsonKeyFilePath.0=
