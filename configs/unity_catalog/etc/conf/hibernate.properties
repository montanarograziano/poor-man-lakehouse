# Unity Catalog metadata database (based on upstream v0.5.0 etc/conf/hibernate.properties).
# H2 file database persisted under the bind-mounted etc/data directory, so catalog
# metadata survives container recreation. Self-contained: no dependency on the
# shared postgres_db service and no JDBC driver classpath concerns.
hibernate.connection.driver_class=org.h2.Driver
hibernate.connection.url=jdbc:h2:file:/home/unitycatalog/etc/data/h2db;DB_CLOSE_DELAY=-1

hibernate.hbm2ddl.auto=update
hibernate.show_sql=false
hibernate.archive.autodetection=class
hibernate.use_sql_comments=true
org.hibernate.SQL=INFO
org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# PostgreSQL alternative (shared postgres_db service). Requires the PostgreSQL JDBC
# driver on the server classpath (jars/classpath) — not guaranteed in the official image.
#hibernate.connection.driver_class=org.postgresql.Driver
#hibernate.connection.url=jdbc:postgresql://postgres_db:5432/catalog_db
#hibernate.connection.user=user
#hibernate.connection.password=password
